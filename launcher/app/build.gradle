plugins {
    id 'com.android.application'
}

// Per-install values (API keys, country, weather city) from launcher/lumen.properties, which stays out of git.
// Copy lumen.properties.example to lumen.properties and fill it in; anything missing builds as empty.
def lumen = new Properties()
def lumenFile = rootProject.file('lumen.properties')
// Strip a UTF-8 BOM (Windows PowerShell adds one) so the first key is not lost.
if (lumenFile.exists()) lumen.load(new StringReader(lumenFile.getText('UTF-8').replace('\uFEFF', '')))
def lumenValue = { String k, String d -> (lumen.getProperty(k) ?: d).trim().replace('"', '') }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.4'
        resValue 'string', 'tmdb_key', lumenValue('tmdb_key', '')
        resValue 'string', 'tmdb_region', lumenValue('tmdb_region', '')
        resValue 'string', 'youtube_key', lumenValue('youtube_key', '')
        resValue 'string', 'weather_city', lumenValue('weather_city', '')
        resValue 'string', 'weather_lat', lumenValue('weather_lat', '')
        resValue 'string', 'weather_lon', lumenValue('weather_lon', '')
        resValue 'string', 'greeting_name', lumenValue('nombre', '')
        // destacados: your own picks first, e.g. netflix:tv/1408 youtube:VIDEO_ID (see lumen.properties.example)
        resValue 'string', 'featured_picks', lumenValue('destacados', '')
        // TV size in inches (32 to 100); 0 or empty = 55" proportions. See LumenScale.
        def inches = lumenValue('pulgadas', '').replaceAll('[^0-9]', '')
        resValue 'integer', 'tv_inches', inches ?: '0'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
